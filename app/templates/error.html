{% extends 'base.html' if usuario_actual else 'publica.html' %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="pagina-error">
  <div>
    <div class="codigo">{{ codigo }}</div>
    <h1>{{ titulo }}</h1>
    <p>{{ mensaje }}</p>
    <a class="btn btn-primario" href="{{ url_for('paginas.inicio') }}">Volver al inicio</a>
  </div>
</div>
{% endblock %}
